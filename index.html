<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Secondly Mom</title>
    <style>
        /* ===== RESET & GLOBAL ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;  /* почти чёрный */
            color: #f0f0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* ===== HEADER ===== */
        #header {
            padding: 20px 20px 10px;
            text-align: center;
        }
        #header h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.15);
        }
        #header p {
            font-size: 13px;
            color: #aaa;
            margin-top: 6px;
        }

        /* ===== СТАРТОВЫЙ ЭКРАН С КНОПКАМИ ===== */
        #start-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .main-btn {
            width: 240px;
            padding: 18px 0;
            margin: 12px;
            background: transparent;
            border: 1px solid #555;
            border-radius: 60px;
            color: #ddd;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .main-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: #fff;
            color: #fff;
        }
        .main-btn:active {
            transform: scale(0.97);
            background: #1a1a1a;
        }

        /* ===== ЧАТ (скрыт по умолчанию) ===== */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: calc(100vh - 56px);
        }
        #chat-header {
            background: #111;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #222;
        }
        #chat-header .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            opacity: 0.6;
            padding: 4px 8px;
        }
        #chat-header .back-btn:active { opacity: 0.3; }
        #chat-header .chat-title {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.8;
            margin-left: 8px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .message {
            max-width: 78%;
            margin-bottom: 14px;
            padding: 10px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.5;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #2a2a2a;
            color: #e8e8e8;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: #1a1a1a;
            color: #d0d0d0;
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .error-message {
            background: #330000;
            color: #ff6b6b;
            text-align: center;
            max-width: 100%;
        }

        /* ===== ПАНЕЛЬ ВВОДА ===== */
        #input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: #111;
            border-top: 1px solid #222;
        }
        #user-input {
            flex: 1;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 28px;
            color: #eee;
            padding: 12px 20px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        #user-input:focus { border-color: #777; }
        #user-input::placeholder { color: #555; }

        .input-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #2b2b2b;
            color: #ccc;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s, transform 0.1s;
        }
        .input-btn:active { transform: scale(0.9); }
