<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assistant Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #212121;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: #2b5277;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #2b5277;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .bot-message {
            background: #333;
            color: #e0e0e0;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .error-message {
            background: #4a1a1a;
            color: #ff7961;
            text-align: center;
            max-width: 100%;
        }

        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #333;
        }

        #user-input {
            flex: 1;
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        #user-input:focus {
            border-color: #2b5277;
        }

        #user-input::placeholder {
            color: #888;
        }

        .btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.9);
        }

        #send-btn {
            background: #4caf50;
            color: white;
        }

        #voice-btn {
            background: #ff9800;
            color: white;
        }

        #voice-btn.listening {
            background: #f44336;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 10px 15px;
            background: #333;
            border-radius: 18px;
            margin-bottom: 12px;
            margin-right: auto;
            max-width: 60px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div id="header">🤖 AI Ассистент</div>
    
    <div id="chat-container">
        <div class="message bot-message">Привет! Я AI ассистент. Задавай вопросы текстом или голосом 🎤</div>
    </div>

    <div id="controls">
        <input type="text" id="user-input" placeholder="Напиши сообщение...">
        <button class="btn" id="send-btn">➤</button>
        <button class="btn" id="voice-btn">🎤</button>
    </div>
