<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Life Log</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            background: #0d0d0d;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 20% 30%, #1a1a1a 0%, #0d0d0d 70%);
        }
        .container { max-width: 600px; width: 100%; margin: 0 auto; padding: 20px; flex: 1; display: flex; flex-direction: column; }

        /* Главная страница */
        #mainPage { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        .logo { font-size: 34px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 12px; }
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 50px; letter-spacing: 1px; }
        .menu-card {
            width: 100%;
            padding: 24px;
            margin: 10px 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .menu-card .icon { font-size: 24px; margin-right: 16px; }
        .menu-card .label { font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
        .menu-card .arrow { color: #888; font-size: 18px; }

        .top-right {
            position: fixed; top: 20px; right: 20px; font-size: 12px;
            background: none; border: 1px solid #444; color: #999;
            padding: 8px 14px; cursor: pointer; transition: 0.3s; border-radius: 20px;
            text-transform: uppercase;
        }
        .top-right:hover { border-color: #f0f0f0; color: #f0f0f0; }

        /* Страницы */
        .page { display: none; flex-direction: column; flex: 1; }
        .page.active { display: flex; }

        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 0; border-bottom: 1px solid #222; margin-bottom: 16px;
        }
        .back-button {
            background: none; border: 1px solid #555; color: #aaa;
            padding: 8px 16px; cursor: pointer; font-size: 13px; border-radius: 20px;
            text-transform: uppercase; transition: 0.3s;
        }
        .back-button:hover { border-color: #f0f0f0; color: #f0f0f0; }
        .chat-title { font-size: 16px; letter-spacing: 1px; color: #f0f0f0; }

        .messages {
            flex: 1; overflow-y: auto; padding: 10px 0; display: flex;
            flex-direction: column; gap: 12px; margin-bottom: 12px;
        }
        .message {
            max-width: 80%; padding: 14px 18px; border-radius: 18px;
            font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: #1e1e1e;
            border-bottom-right-radius: 4px;
            border: 1px solid #333;
        }
        .message.ai {
            align-self: flex-start;
            background: #111;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a2a;
        }
        .input-area {
            display: flex; gap: 8px; padding: 12px 0;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid #222;
            backdrop-filter: blur(10px);
        }
        .input-area input {
            flex: 1; padding: 14px 18px; background: #1a1a1a; border: 1px solid #333;
            color: #f0f0f0; font-size: 15px; outline: none; border-radius: 24px;
        }
        .input-area input:focus { border-color: #f0f0f0; }
        .input-area input::placeholder { color: #666; }
        .send-btn {
            padding: 14px 24px; background: #f0f0f0; color: #0d0d0d;
            border: none; border-radius: 24px; font-size: 14px; cursor: pointer;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            transition: transform 0.2s, background 0.2s;
        }
        .send-btn:hover { background: #fff; transform: scale(1.03); }
        .loading { text-align: center; padding: 16px; color: #888; font-size: 13px; }

        .email {
            text-align: center; margin-top: 60px; font-size: 14px; color: #aaa;
            line-height: 1.8; padding: 20px; border: 1px solid #222; border-radius: 16px;
            background: rgba(255,255,255,0.02);
        }
    </style>
</head>
<body>
    <!-- Главная -->
    <div id="mainPage">
        <button class="top-right" onclick="showSuggestions()">Предложения</button>
        <div class="container">
            <div class="logo">Life·Log</div>
            <div class="subtitle">Твой персональный ассистент</div>

            <div class="menu-card" onclick="startChat('plan')">
                <div><span class="icon">📋</span><span class="label">Планы и задачи</span></div>
                <span class="arrow">→</span>
            </div>

            <div class="menu-card" onclick="startChat('food')">
                <div><span class="icon">🍎</span><span class="label">Питание</span></div>
                <span class="arrow">→</span>
            </div>
        </div>
    </div>

    <!-- Чат -->
    <div id="chatPage" class="page">
        <div class="container">
            <div class="chat-header">
                <button class="back-button" onclick="goHome()">← Назад</button>
                <span class="chat-title" id="chatTitle">Чат</span>
            </div>
            <div class="messages" id="chatMessages"></div>
            <div id="loadingIndicator" class="loading" style="display:none;">ИИ печатает...</div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Напишите сообщение..." 
                       onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- Предложения -->
    <div id="suggestionsPage" class="page">
        <div class="container">
            <div class="chat-header">
                <button class="back-button" onclick="goHome()">← Назад</button>
                <span class="chat-title">Предложения</span>
            </div>
            <div class="email">
                <p>Если у вас есть идеи, как улучшить Life·Log, напишите нам:</p>
                <p style="margin-top:16px; font-weight:600;">nikitacalev@gmail.com</p>
            </div>
        </div>
    </div>

    <script>
        /*** НАСТРОЙКИ ***/
        const WORKER_URL = 'https://life-log-journal.nikitacalev.workers.dev/'; // ← ВСТАВЬТЕ URL WORKER
        /*****************/

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let currentMode = '';
        let messageHistory = [];

        function startChat(mode) {
            currentMode = mode;
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('suggestionsPage').classList.remove('active');
            document.getElementById('suggestionsPage').style.display = 'none';
            const chatPage = document.getElementById('chatPage');
            chatPage.style.display = 'flex';
            chatPage.classList.add('active');
            
            const titles = { plan: 'Планы и задачи', food: 'Питание' };
            document.getElementById('chatTitle').textContent = titles[mode] || 'Чат';
            document.getElementById('chatMessages').innerHTML = '';
            messageHistory = [];

            const prompts = {
                plan: 'Привет! Я помогу организовать твои планы и задачи. Напиши, с чего начнём?',
                food: 'Привет! Я буду вести учёт твоего питания. Что ты сегодня съел?'
            };
            addMessage(prompts[mode], 'ai');
        }

        function showSuggestions() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('chatPage').classList.remove('active');
            document.getElementById('chatPage').style.display = 'none';
            const sugPage = document.getElementById('suggestionsPage');
            sugPage.style.display = 'flex';
            sugPage.classList.add('active');
        }

        function goHome() {
            document.getElementById('chatPage').classList.remove('active');
            document.getElementById('chatPage').style.display = 'none';
            document.getElementById('suggestionsPage').classList.remove('active');
            document.getElementById('suggestionsPage').style.display = 'none';
            document.getElementById('mainPage').style.display = 'flex';
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            div.textContent = text;
            document.getElementById('chatMessages').appendChild(div);
            const messagesEl = document.getElementById('chatMessages');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            
            addMessage(text, 'user');
            messageHistory.push({ role: 'user', content: text });
            
            document.getElementById('loadingIndicator').style.display = 'block';
            
            let systemPrompt;
            if (currentMode === 'plan') {
                systemPrompt = `Ты — Life·Log, персональный ассистент для планирования.
Ты помогаешь только с задачами, целями, расписанием и организацией времени.
Отвечай конкретно, давай пошаговые планы, используй таблицы и списки.
Если вопрос не по теме — вежливо откажись вернуться к задачам пользователя.`;
            } else {
                systemPrompt = `Ты — Life·Log, персональный диетолог и трекер питания.
Записывай каждый продукт, который называет пользователь, и его граммовку.
По команде «итог дня» выведи аккуратную таблицу КБЖУ.
Рекомендуй, как улучшить рацион.
Если вопрос не по теме — вежливо откажись.`;
            }
            
            const messages = [{ role: 'system', content: systemPrompt }, ...messageHistory];
            
            try {
                const response = await fetch(WORKER_URL + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messages })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error('Worker error: ' + errText);
                }
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                const reply = data.reply;
                messageHistory.push({ role: 'assistant', content: reply });
                addMessage(reply, 'ai');
            } catch (error) {
                addMessage('Ошибка: ' + error.message, 'ai');
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }
    </script>
</body>
</html>
